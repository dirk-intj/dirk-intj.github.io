name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx quartz build
      - name: Add legal disclaimer to HTML footer
        run: find public -name "*.html" -type f -exec sed -i 's#<div class="right sidebar"></div>#<div class="right sidebar"></div><div class="legal-disclaimer" style="grid-column: 1 / -1; width: 100%; margin-top: 2.5rem; padding-top: 1rem; border-top: 1px dashed var(--lightgray); text-align: center;"><p style="font-size: 0.8rem; color: var(--gray); line-height: 1.45; margin: 0 0 0.4rem 0;"><b>Возрастная категория: 18+</b><br>Все материалы данного ресурса являются некоммерческим литературным творчеством и художественным вымыслом автора.</p><p style="font-size: 0.95rem; color: var(--darkgray); margin: 0;">© Hiddenheið | Dirk.Intj | 2026. <br>Все права защищены.</p></div>#g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
